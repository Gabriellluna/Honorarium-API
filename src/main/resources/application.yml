spring:
  application:
    name: honorarios-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/honorarios}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}          # sem valor padrão de propósito: em produção vem de variável de ambiente
  access-token-minutes: 15

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://controle-de-honorarios.vercel.app,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
